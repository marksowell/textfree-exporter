<!doctype html>
<html lang="en"><meta charset="utf-8"><title>TextFree export</title>
<link rel="stylesheet" href="popup.css">
<body><h1>Save your TextFree history</h1>
<p>Export the current conversation first, or collect the entire inbox. Keep TextFree open while it runs.</p>
<label><input id="media" type="checkbox" checked> Download accessible attachments</label>
<p class="note">Voicemail transcripts are saved. Audio that TextFree does not expose is listed as missing. Opening conversations may mark them as read.</p>
<button id="current">Export current conversation</button>
<button id="all">Export entire inbox</button>
<p id="status" role="status"></p>
<script src="popup.js"></script></body></html>
