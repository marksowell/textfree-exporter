<!doctype html>
<html lang="en"><meta charset="utf-8"><title>TextFree Local Exporter</title>
<link rel="stylesheet" href="popup.css">
<body><header><p class="eyebrow">TextFree Local Exporter <span id="version"></span></p><h1>Save your conversations.</h1><p>Keep a readable copy of your messages, calls, and voicemail recordings.</p></header>
<label class="media-option"><input id="media" type="checkbox" checked><span>Include media<span class="option-note">Attachments and voicemail audio</span></span></label>
<button id="current">Export current conversation</button>
<button id="all">Export entire inbox</button>
<p class="note">Keep TextFree open while capture runs. Opening conversations can mark them as read; capturing voicemail can mark it as listened to.</p>
<p id="status" role="status"></p>
<script src="popup.js"></script></body></html>
